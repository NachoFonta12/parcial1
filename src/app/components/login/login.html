<section class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>¡Bienvenido!</h1>
            <p class="subtitle">Si ya tienes una cuenta, inicia sesión a continuación</p>
        </div>

        <form class="auth-form">
            <div class="form-group">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="******" required>
            </div>

            <!-- Botón principal de login que faltaba en tu HTML original -->
            <button type="submit" class="btn-primary">Iniciar sesión</button>

            <!-- Sección de administrador separada visualmente -->
            <div class="admin-section">
                <div class="divider">
                    <span>o</span>
                </div>
                <p class="hint-text text-center">Si eres administrador, utiliza el acceso rápido:</p>
                <button type="button" class="btn-secondary">Acceso rápido</button>
            </div>
        </form>

        <div class="auth-footer">
            <p>
                ¿No tienes una cuenta? 
                <a routerLink="/register" class="text-link">Regístrate aquí</a>
            </p>
        </div>
    </div>
</section>
