<section class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>¡Bienvenido!</h1>
            <p class="subtitle">Si ya tienes una cuenta, inicia sesión a continuación</p>
        </div>

        <form class="auth-form" (ngSubmit) = "onSubmit()">
            <div class="form-group">
                <label for="email">Correo</label>
                <input type="email" id="email" [(ngModel)] ="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="******" required>
            </div>

            <!-- Botón principal de login que faltaba en tu HTML original -->
            <button type="submit" class="btn-primary">
                @if (loading()) {
                    Cargando...
                }
                @else {
                    Iniciar sesión
                }
            </button>

            @if (errorMessage() !== '') {
                <p class="error-message"> {{errorMessage()}} </p>
            }

            <!-- Sección de administrador separada visualmente -->
            <div class="admin-section">
                <div class="divider">
                    <span>o</span>
                </div>
                <p class="hint-text text-center">Si eres administrador, identifícate:</p>
                <button type="button" class="btn-secondary" (click)="quickAccess('rgplazas@ejemplo.com', 'rgplazas')">Ricardo Gastón Plazas</button>
                <button type="button" class="btn-secondary" (click)="quickAccess('mquintana@fra.utn.edu.ar', 'mqmiño')">Manuel Quintana</button>
                <button type="button" class="btn-secondary" (click)="quickAccess('jmereles@fra.utn.edu.ar', 'jmereles')">Jazmín Mereles</button>
            </div>
        </form>

        <div class="auth-footer">
            <p>
                ¿No tienes una cuenta? 
                <a routerLink="/register" class="text-link">Regístrate aquí</a>
            </p>
        </div>
    </div>
</section>
