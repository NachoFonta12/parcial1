<section class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Crea una cuenta</h1>
            <p class="subtitle">Si es la primera vez que nos visitas, crea una cuenta para comenzar a jugar.</p>
        </div>

        <form class="auth-form" (ngSubmit) = "onSubmit()">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" [(ngModel)] ="name" name="username" placeholder="Ricardo Plazas" required>
                <!-- La nota como un texto de ayuda sutil -->
                <span class="hint-text">Nota: No escribas tu nombre real. Este será visto por todos los demás jugadores.</span>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" [(ngModel)] ="email" name="email" placeholder="ejemplo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" [(ngModel)] ="password" name="password" placeholder="********" required>
            </div>

            <div class="form-group">
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento" [(ngModel)] ="birthdate" name="fechaNacimiento" required>
            </div>

            <button type="submit" class="btn-primary">
                @if (loading()) {
                    Registrando usuario...
                }
                @else {
                    Registrarme
                }
            </button>
            
            @if (errorMessage() !== '') {
                <p> {{errorMessage()}} </p>
            }

        </form>

        <div class="auth-footer">
            <p>
                ¿Ya tienes una cuenta? 
                <a routerLink="/login" class="text-link">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</section>
