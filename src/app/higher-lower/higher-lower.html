<button (click)="deckService.showFirstCard()">HOLA</button>
<button (click)="deckService.loadDeck()">HOLA</button>
<button (click)="deckService.shuffleDeck()">HOLA</button>



<p> {{firstCard()?.value}} de {{firstCard()?.palo}} </p>
<img [src]="firstCard()?.url" width="100">


<p>///////////////////////// </p>
@for(card of deck(); track $index) {
    <p> {{card.value}} de {{card.palo}} </p>
    <img [src]="card.url" width="100">
}
